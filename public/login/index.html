```html
<!-- caminho: public/login/index.html -->

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - WhatsApp Bot
    </title>

    <link
        rel="stylesheet"
        href="/login/style.css"
    >

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <h1>
                WhatsApp Bot
            </h1>

            <p class="subtitle">
                Protected access
            </p>

            <form id="login-form">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    id="login-button"
                    type="submit"
                >
                    Sign In
                </button>

            </form>

            <p id="result"></p>

        </div>

    </main>

    <script
        src="/login/login.js"
        type="module"
    ></script>

</body>

</html>
```
