<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste de Grupos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #999;
        }

        .dot.connected {
            background: #22c55e;
        }

        .dot.error {
            background: #ef4444;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        .primary {
            background: #111;
            color: #fff;
        }

        .secondary {
            background: #e5e7eb;
            color: #111;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #groups {
            margin-top: 20px;
        }

        .group {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            background: #fafafa;
        }

        .group:hover {
            background: #f0f1f3;
        }

        .group-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .group-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
        }

        .group-content {
            flex: 1;
            min-width: 0;
        }

        .group-name {
            font-weight: bold;
        }

        .group-id {
            margin-top: 4px;
            font-size: 12px;
            color: #777;
            word-break: break-all;
        }

        .selection-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #f4f5f7;
        }

        .select-all {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .select-all input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .selected-count {
            color: #666;
            font-size: 14px;
        }

        .message-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #message {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        #message:focus {
            outline: none;
            border-color: #111;
        }

        .send-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
        }

        .send-info {
            color: #666;
            font-size: 14px;
        }

        .send-info strong {
            color: #222;
        }

        #send-status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #f4f5f7;
            color: #555;
            font-size: 14px;
        }

        #logs {
            background: #111;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
        }

        .empty {
            color: #777;
            padding: 20px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>W</h1>

    <h2>Teste de Grupos</h2>

    <div class="subtitle">
        Página simplificada para testar grupos e divulgação.
    </div>


    <div class="card">

        <div class="status">

            <span
                id="connection-dot"
                class="dot"
            ></span>

            <strong id="connection-status">
                Conectando...
            </strong>

        </div>


        <button
            id="get-groups"
            class="primary"
            type="button"
        >
            Buscar grupos
        </button>


        <button
            id="disconnect"
            class="secondary"
            type="button"
        >
            Desconectar
        </button>

    </div>


    <div class="card">

        <h3>Grupos</h3>

        <div>
            Total:
            <strong id="group-count">0</strong>
        </div>


        <div class="selection-bar">

            <label class="select-all">

                <input
                    type="checkbox"
                    id="select-all"
                >

                <span>
                    Selecionar todos
                </span>

            </label>


            <span
                id="selected-count"
                class="selected-count"
            >
                0 selecionados
            </span>

        </div>


        <div id="groups">

            <div class="empty">
                Nenhum grupo recebido.
            </div>

        </div>

    </div>


    <!-- ===================================== -->
    <!-- DIVULGAÇÃO                            -->
    <!-- ===================================== -->

    <div class="card">

        <h3>Divulgação</h3>

        <p class="subtitle">
            Escreva a mensagem e selecione os grupos que receberão o envio.
        </p>


        <label
            class="message-label"
            for="message"
        >
            Mensagem
        </label>


        <textarea
            id="message"
            maxlength="4096"
            placeholder="Digite aqui a mensagem da divulgação..."
        ></textarea>


        <div class="send-area">

            <div class="send-info">

                <strong id="send-target-count">
                    0 grupos
                </strong>

                <div>
                    selecionados para envio
                </div>

            </div>


            <div>

                <button
                    id="send-message"
                    class="primary"
                    type="button"
                    disabled
                >
                    Enviar divulgação
                </button>


                <button
                    id="cancel-send"
                    class="secondary"
                    type="button"
                    disabled
                >
                    Cancelar
                </button>

            </div>

        </div>


        <div id="send-status">
            Aguardando mensagem.
        </div>

    </div>


    <div class="card">

        <h3>Logs</h3>

        <div id="logs"></div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script type="module">

    const socket = io()


    const status =
        document.getElementById(
            'connection-status'
        )


    const dot =
        document.getElementById(
            'connection-dot'
        )


    const groupsContainer =
        document.getElementById(
            'groups'
        )


    const groupCount =
        document.getElementById(
            'group-count'
        )


    const logs =
        document.getElementById(
            'logs'
        )


    const getGroupsButton =
        document.getElementById(
            'get-groups'
        )


    const disconnectButton =
        document.getElementById(
            'disconnect'
        )


    const selectAll =
        document.getElementById(
            'select-all'
        )


    const selectedCount =
        document.getElementById(
            'selected-count'
        )


    const sendTargetCount =
        document.getElementById(
            'send-target-count'
        )


    const messageInput =
        document.getElementById(
            'message'
        )


    const sendButton =
        document.getElementById(
            'send-message'
        )


    const cancelButton =
        document.getElementById(
            'cancel-send'
        )


    const sendStatus =
        document.getElementById(
            'send-status'
        )


    let availableGroups = []


    let sending = false


    function log(message, data) {

        const time =
            new Date().toLocaleTimeString()


        let text =
            `[${time}] ${message}`


        if (data !== undefined) {

            try {

                text +=
                    '\n' +
                    JSON.stringify(
                        data,
                        null,
                        2
                    )

            } catch (error) {

                text +=
                    '\n' +
                    String(data)

            }

        }


        logs.textContent +=
            text +
            '\n\n'


        logs.scrollTop =
            logs.scrollHeight


        console.log(
            message,
            data
        )

    }


    function getSelectedGroups() {

        return [
            ...document.querySelectorAll(
                '.group-checkbox:checked'
            )
        ].map(
            checkbox =>
                checkbox.value
        )

    }


    function updateSelection() {

        const selectedGroups =
            getSelectedGroups()


        const selected =
            selectedGroups.length


        selectedCount.textContent =
            `${selected} selecionados`


        sendTargetCount.textContent =
            `${selected} ${
                selected === 1
                    ? 'grupo'
                    : 'grupos'
            }`


        selectAll.checked =
            availableGroups.length > 0 &&
            selected ===
                availableGroups.length


        selectAll.indeterminate =
            selected > 0 &&
            selected <
                availableGroups.length


        updateSendButton()


        log(
            'SELEÇÃO ATUALIZADA',
            {
                quantidade:
                    selected,
                grupos:
                    selectedGroups
            }
        )

    }


    function updateSendButton() {

        const selectedGroups =
            getSelectedGroups()


        const message =
            messageInput.value.trim()


        sendButton.disabled =
            !socket.connected ||
            selectedGroups.length === 0 ||
            message.length === 0 ||
            sending

    }


    function renderGroups(groups) {

        log(
            'RENDERIZANDO GRUPOS',
            groups
        )


        if (!Array.isArray(groups)) {

            log(
                'ERRO: groups não é um Array.'
            )

            return

        }


        availableGroups =
            groups


        groupCount.textContent =
            groups.length


        groupsContainer.innerHTML = ''


        if (!groups.length) {

            groupsContainer.innerHTML = `
                <div class="empty">
                    O servidor enviou 0 grupos.
                </div>
            `

            updateSelection()

            return

        }


        groups.forEach(
            (group, index) => {

                const div =
                    document.createElement(
                        'div'
                    )


                div.className =
                    'group'


                const name =
                    group?.name ||
                    `Grupo ${index + 1}`


                const id =
                    group?.id ||
                    ''


                div.innerHTML = `

                    <div class="group-line">

                        <input
                            type="checkbox"
                            class="group-checkbox"
                            value="${escapeHtml(id)}"
                        >

                        <div class="group-content">

                            <div class="group-name">
                                ${escapeHtml(name)}
                            </div>

                            <div class="group-id">
                                ${escapeHtml(id)}
                            </div>

                        </div>

                    </div>

                `


                const checkbox =
                    div.querySelector(
                        '.group-checkbox'
                    )


                checkbox.addEventListener(
                    'change',
                    updateSelection
                )


                groupsContainer.appendChild(
                    div
                )

            }
        )


        updateSelection()


        log(
            'GRUPOS RENDERIZADOS',
            {
                quantidade:
                    groups.length
            }
        )

    }


    socket.on(
        'connect',
        () => {

            status.textContent =
                'Socket conectado'


            dot.className =
                'dot connected'


            log(
                'Socket.IO conectado.'
            )


            log(
                'Socket ID:',
                socket.id
            )


            updateSendButton()

        }
    )


    socket.on(
        'disconnect',
        reason => {

            status.textContent =
                'Socket desconectado'


            dot.className =
                'dot error'


            log(
                'Socket.IO desconectado.',
                reason
            )


            updateSendButton()

        }
    )


    socket.on(
        'connect_error',
        error => {

            status.textContent =
                'Erro de conexão'


            dot.className =
                'dot error'


            log(
                'CONNECT ERROR',
                error.message
            )


            updateSendButton()

        }
    )


    socket.on(
        'auth-error',
        data => {

            log(
                'AUTH ERROR',
                data
            )

        }
    )


    socket.on(
        'whatsapp-state',
        state => {

            log(
                'WHATSAPP-STATE RECEBIDO',
                state
            )


            /*
             * O backend já envia os grupos
             * dentro do whatsapp-state.
             *
             * Portanto podemos renderizar
             * diretamente daqui.
             */

            if (
                state &&
                Array.isArray(
                    state.groups
                )
            ) {

                renderGroups(
                    state.groups
                )

            }

        }
    )


    socket.on(
        'groups',
        groups => {

            log(
                'EVENTO "groups" RECEBIDO',
                groups
            )


            renderGroups(
                groups
            )

        }
    )


    getGroupsButton.addEventListener(
        'click',
        () => {

            log(
                'BOTÃO "BUSCAR GRUPOS" CLICADO.'
            )


            log(
                'Socket conectado:',
                socket.connected
            )


            log(
                'Socket ID:',
                socket.id
            )


            socket.emit(
                'get-groups'
            )


            log(
                'Evento "get-groups" enviado para o servidor.'
            )

        }
    )


    selectAll.addEventListener(
        'change',
        () => {

            const checkboxes =
                document.querySelectorAll(
                    '.group-checkbox'
                )


            checkboxes.forEach(
                checkbox => {

                    checkbox.checked =
                        selectAll.checked

                }
            )


            updateSelection()

        }
    )


    messageInput.addEventListener(
        'input',
        () => {

            updateSendButton()

        }
    )


    /*
     * =====================================
     * FUNÇÃO DE ENVIO
     * =====================================
     */

    function sendMessage() {

        log(
            'BOTÃO "ENVIAR DIVULGAÇÃO" CLICADO.'
        )


        const groupIds =
            getSelectedGroups()


        const message =
            messageInput.value.trim()


        log(
            'GRUPOS SELECIONADOS:',
            groupIds
        )


        log(
            'MENSAGEM:',
            message
        )


        if (!socket.connected) {

            log(
                'ERRO: Socket desconectado.'
            )

            sendStatus.textContent =
                'Erro: conexão com o servidor não está disponível.'

            return

        }


        if (!groupIds.length) {

            sendStatus.textContent =
                'Selecione pelo menos um grupo.'

            log(
                'ERRO: nenhum grupo selecionado.'
            )

            return

        }


        if (!message) {

            sendStatus.textContent =
                'Digite uma mensagem.'

            log(
                'ERRO: mensagem vazia.'
            )

            return

        }


        if (sending) {

            log(
                'ENVIO JÁ ESTÁ EM ANDAMENTO.'
            )

            return

        }


        sending = true


        sendButton.disabled = true
        cancelButton.disabled = false


        sendStatus.textContent =
            `Enviando para ${groupIds.length} grupos...`


        const data = {

            groupIds:
                groupIds,

            message:
                message

        }


        log(
            'ENVIANDO EVENTO "send-message"',
            data
        )


        socket.emit(
            'send-message',
            data
        )


        log(
            'EVENTO "send-message" ENVIADO.'
        )

    }


    sendButton.addEventListener(
        'click',
        sendMessage
    )


    /*
     * =====================================
     * CANCELAR ENVIO
     * =====================================
     */

    cancelButton.addEventListener(
        'click',
        () => {

            log(
                'BOTÃO "CANCELAR" CLICADO.'
            )


            socket.emit(
                'cancel-send'
            )


            sendStatus.textContent =
                'Solicitação de cancelamento enviada.'

        }
    )


    /*
     * =====================================
     * RESULTADO DO ENVIO
     * =====================================
     */

    socket.on(
        'send-result',
        data => {

            log(
                'SEND-RESULT RECEBIDO',
                data
            )


            if (
                data &&
                data.success === false
            ) {

                sending = false

                cancelButton.disabled =
                    true


                sendStatus.textContent =
                    data.message ||
                    'Erro ao enviar mensagem.'


                updateSendButton()

                return

            }


            if (
                data &&
                data.success === true
            ) {

                sendStatus.textContent =
                    'Envio concluído.'

            }

        }
    )


    socket.on(
        'send-started',
        data => {

            log(
                'SEND-STARTED RECEBIDO',
                data
            )

        }
    )


    socket.on(
        'send-progress',
        data => {

            log(
                'SEND-PROGRESS RECEBIDO',
                data
            )


            if (!data) {
                return
            }


            const current =
                data.current || 0


            const total =
                data.total || 0


            if (total > 0) {

                sendStatus.textContent =
                    `Enviando ${current} de ${total}: ${
                        data.group || ''
                    }`

            }

        }
    )


    socket.on(
        'send-finished',
        data => {

            log(
                'SEND-FINISHED RECEBIDO',
                data
            )


            sending = false


            cancelButton.disabled =
                true


            sendStatus.textContent =
                'Envio concluído.'


            updateSendButton()

        }
    )


    socket.on(
        'send-cancelled',
        data => {

            log(
                'SEND-CANCELLED RECEBIDO',
                data
            )


            sending = false


            cancelButton.disabled =
                true


            sendStatus.textContent =
                'Envio cancelado.'


            updateSendButton()

        }
    )


    socket.on(
        'cancel-result',
        data => {

            log(
                'CANCEL-RESULT RECEBIDO',
                data
            )

        }
    )


    disconnectButton.addEventListener(
        'click',
        () => {

            log(
                'BOTÃO "DESCONECTAR" CLICADO.'
            )


            socket.disconnect()

        }
    )


    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            )

    }

</script>

</body>

</html>
