```html
<!-- caminho: public/painel/index.html -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel WhatsApp</title>

    <link
        rel="stylesheet"
        href="/painel/style.css"
    >

</head>

<body>

    <main class="painel">

        <header class="painel-header">

            <div>

                <h1>Grupos</h1>

                <p>
                    Grupos disponíveis no WhatsApp
                </p>

            </div>

            <div
                id="group-count"
                class="group-count"
            >
                0 grupos
            </div>

        </header>


        <section class="groups-section">

            <div
                id="groups"
                class="groups-list"
            >
                <div class="loading">
                    Carregando grupos...
                </div>
            </div>

        </section>

    </main>


    <script src="/socket.io/socket.io.js"></script>


    <script>

        const socket =
            io()


        const groupsContainer =
            document.getElementById(
                'groups'
            )


        const groupCount =
            document.getElementById(
                'group-count'
            )


        function showGroups(groups) {

            console.log(
                '[PAINEL] Grupos recebidos:',
                groups
            )


            if (
                !Array.isArray(groups) ||
                groups.length === 0
            ) {

                groupsContainer.innerHTML =
                    `
                    <div class="empty">
                        Nenhum grupo encontrado.
                    </div>
                    `

                groupCount.textContent =
                    '0 grupos'

                return

            }


            groupsContainer.innerHTML =
                ''


            groupCount.textContent =
                `${groups.length} grupos`


            groups.forEach(
                (group, index) => {

                    const item =
                        document.createElement(
                            'div'
                        )


                    item.className =
                        'group-item'


                    item.dataset.id =
                        group.id


                    item.innerHTML =
                        `
                        <span class="group-number">
                            ${index + 1}
                        </span>

                        <span class="group-name">
                            ${escapeHTML(
                                group.name
                            )}
                        </span>
                        `


                    groupsContainer.appendChild(
                        item
                    )

                }
            )

        }


        function escapeHTML(text) {

            const element =
                document.createElement(
                    'div'
                )

            element.textContent =
                text || 'Grupo sem nome'

            return element.innerHTML

        }


        socket.on(
            'connect',
            () => {

                console.log(
                    '[PAINEL] Socket conectado:',
                    socket.id
                )

            }
        )


        socket.on(
            'disconnect',
            () => {

                console.log(
                    '[PAINEL] Socket desconectado.'
                )

            }
        )


        socket.on(
            'groups',
            groups => {

                showGroups(
                    groups
                )

            }
        )


        socket.on(
            'whatsapp-state',
            state => {

                console.log(
                    '[PAINEL] Estado recebido:',
                    state
                )


                if (
                    state &&
                    Array.isArray(
                        state.groups
                    )
                ) {

                    showGroups(
                        state.groups
                    )

                }

            }
        )


        socket.on(
            'auth-error',
            data => {

                console.error(
                    '[PAINEL] Erro de autenticação:',
                    data
                )


                groupsContainer.innerHTML =
                    `
                    <div class="error">
                        Sessão não autenticada.
                    </div>
                    `

            }
        )

    </script>

</body>

</html>
```
