<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel WhatsApp</title>

    <link
        rel="stylesheet"
        href="/painel/style.css"
    >

</head>

<body>

    <main class="panel">

        <header class="panel-header">

            <div>

                <div class="eyebrow">
                    WHATSAPP BOT
                </div>

                <h1>
                    Painel
                </h1>

                <p>
                    Controle e envio de mensagens.
                </p>

            </div>

            <button
                id="logout"
                class="button secondary"
                type="button"
            >
                Sair
            </button>

        </header>


        <section class="status-grid">

            <div class="status-card">

                <span>
                    Servidor
                </span>

                <strong
                    id="connection-status"
                >
                    Conectando...
                </strong>

            </div>


            <div class="status-card">

                <span>
                    WhatsApp
                </span>

                <strong
                    id="whatsapp-status"
                >
                    Aguardando...
                </strong>

            </div>

        </section>


        <section class="panel-card">

            <div class="eyebrow">
                MENSAGEM
            </div>

            <h2>
                Enviar mensagem
            </h2>


            <div class="form-group">

                <label
                    for="group"
                >
                    Grupo
                </label>

                <select
                    id="group"
                >

                    <option value="">
                        Carregando grupos...
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label
                    for="message"
                >
                    Mensagem
                </label>

                <textarea
                    id="message"
                    rows="6"
                    placeholder="Digite sua mensagem..."
                ></textarea>

            </div>


            <div class="actions">

                <button
                    id="send"
                    class="button primary"
                    type="button"
                >
                    Enviar mensagem
                </button>

                <button
                    id="cancel-send"
                    class="button secondary"
                    type="button"
                >
                    Cancelar
                </button>

            </div>


            <div
                id="result"
                class="result"
            ></div>

        </section>

    </main>


    <script
        src="/socket.io/socket.io.js"
    ></script>

    <script
        type="module"
        src="/painel/js/panel.js"
    ></script>

</body>

</html>
