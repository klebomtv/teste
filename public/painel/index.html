<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste de Grupos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #999;
        }

        .dot.connected {
            background: #22c55e;
        }

        .dot.error {
            background: #ef4444;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        .primary {
            background: #111;
            color: #fff;
        }

        .secondary {
            background: #e5e7eb;
            color: #111;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #groups {
            margin-top: 20px;
        }

        .group {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            background: #fafafa;
        }

        .group-name {
            font-weight: bold;
        }

        .group-id {
            margin-top: 4px;
            font-size: 12px;
            color: #777;
            word-break: break-all;
        }

        #logs {
            background: #111;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
        }

        .empty {
            color: #777;
            padding: 20px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>W</h1>

    <h2>Teste de Grupos</h2>

    <div class="subtitle">
        Página simplificada para testar o recebimento dos grupos.
    </div>


    <div class="card">

        <div class="status">

            <span
                id="connection-dot"
                class="dot"
            ></span>

            <strong id="connection-status">
                Conectando...
            </strong>

        </div>


        <button
            id="get-groups"
            class="primary"
            type="button"
        >
            Buscar grupos
        </button>


        <button
            id="disconnect"
            class="secondary"
            type="button"
        >
            Desconectar
        </button>

    </div>


    <div class="card">

        <h3>Grupos</h3>

        <div>
            Total:
            <strong id="group-count">0</strong>
        </div>

        <div id="groups">

            <div class="empty">
                Nenhum grupo recebido.
            </div>

        </div>

    </div>


    <div class="card">

        <h3>Logs</h3>

        <div id="logs"></div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script type="module">

    const socket = io()


    const status =
        document.getElementById(
            'connection-status'
        )


    const dot =
        document.getElementById(
            'connection-dot'
        )


    const groupsContainer =
        document.getElementById(
            'groups'
        )


    const groupCount =
        document.getElementById(
            'group-count'
        )


    const logs =
        document.getElementById(
            'logs'
        )


    const getGroupsButton =
        document.getElementById(
            'get-groups'
        )


    const disconnectButton =
        document.getElementById(
            'disconnect'
        )


    function log(message, data) {

        const time =
            new Date().toLocaleTimeString()


        let text =
            `[${time}] ${message}`


        if (data !== undefined) {

            try {

                text +=
                    '\n' +
                    JSON.stringify(
                        data,
                        null,
                        2
                    )

            } catch (error) {

                text +=
                    '\n' +
                    String(data)

            }

        }


        logs.textContent +=
            text +
            '\n\n'


        logs.scrollTop =
            logs.scrollHeight


        console.log(
            message,
            data
        )
    }


    socket.on(
        'connect',
        () => {

            status.textContent =
                'Socket conectado'


            dot.className =
                'dot connected'


            log(
                'Socket.IO conectado.'
            )


            log(
                'Socket ID:',
                socket.id
            )

        }
    )


    socket.on(
        'disconnect',
        reason => {

            status.textContent =
                'Socket desconectado'


            dot.className =
                'dot error'


            log(
                'Socket.IO desconectado.',
                reason
            )

        }
    )


    socket.on(
        'connect_error',
        error => {

            status.textContent =
                'Erro de conexão'


            dot.className =
                'dot error'


            log(
                'CONNECT ERROR',
                error.message
            )

        }
    )


    socket.on(
        'auth-error',
        data => {

            log(
                'AUTH ERROR',
                data
            )

        }
    )


    socket.on(
        'whatsapp-state',
        state => {

            log(
                'WHATSAPP-STATE RECEBIDO',
                state
            )

        }
    )


    socket.on(
        'groups',
        groups => {

            log(
                'EVENTO "groups" RECEBIDO',
                groups
            )


            if (!Array.isArray(groups)) {

                log(
                    'ERRO: groups não é um Array.'
                )

                return

            }


            groupCount.textContent =
                groups.length


            groupsContainer.innerHTML = ''


            if (!groups.length) {

                groupsContainer.innerHTML = `
                    <div class="empty">
                        O servidor enviou 0 grupos.
                    </div>
                `

                return

            }


            groups.forEach(
                (group, index) => {

                    const div =
                        document.createElement(
                            'div'
                        )


                    div.className =
                        'group'


                    const name =
                        group?.name ||
                        `Grupo ${index + 1}`


                    const id =
                        group?.id ||
                        'ID não informado'


                    div.innerHTML = `

                        <div class="group-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="group-id">
                            ${escapeHtml(id)}
                        </div>

                    `


                    groupsContainer.appendChild(
                        div
                    )

                }
            )

        }
    )


    getGroupsButton.addEventListener(
        'click',
        () => {

            log(
                'BOTÃO "BUSCAR GRUPOS" CLICADO.'
            )


            log(
                'Socket conectado:',
                socket.connected
            )


            log(
                'Socket ID:',
                socket.id
            )


            /*
             * IMPORTANTE:
             *
             * Estamos tentando descobrir
             * qual evento o backend espera.
             *
             * Primeiro tentamos "get-groups".
             */

            socket.emit(
                'get-groups'
            )


            log(
                'Evento "get-groups" enviado para o servidor.'
            )

        }
    )


    disconnectButton.addEventListener(
        'click',
        () => {

            log(
                'BOTÃO DESCONectar CLICADO.'
            )


            socket.disconnect()

        }
    )


    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            )

    }

</script>

</body>

</html>
