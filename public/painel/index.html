```html
<!-- caminho: public/painel/index.html -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WhatsApp Bot</title>

    <link
        rel="stylesheet"
        href="/painel/style.css"
    >

</head>

<body>

    <main
        id="panel-page"
        class="page"
    >

        <section
            class="card panel-card"
        >

            <h1>
                WhatsApp Bot
            </h1>


            <!-- STATUS -->

            <p
                id="panel-status"
                class="panel-status"
            >
                WhatsApp conectado.
            </p>


            <!-- MENSAGEM -->

            <div
                class="message-section"
            >

                <label
                    for="message"
                >
                    Message
                </label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Enter your message..."
                ></textarea>

            </div>


            <!-- GRUPOS -->

            <div
                class="groups-section"
            >

                <div
                    class="groups-header"
                >

                    <span>
                        Groups
                    </span>


                    <label
                        class="select-all"
                    >

                        <input
                            type="checkbox"
                            id="select-all"
                        >

                        Send to all

                    </label>

                </div>


                <!--
                    O JavaScript vai preencher
                    este elemento com os grupos.
                -->

                <div
                    id="groups"
                    class="groups-list"
                >

                    <p
                        class="groups-empty"
                    >
                        Loading groups...
                    </p>

                </div>

            </div>


            <!-- ENVIAR -->

            <button
                id="send-message"
                type="button"
            >
                Send Message
            </button>


            <!-- STATUS DO ENVIO -->

            <div
                id="send-status"
                class="send-status"
            ></div>


            <!-- COOLDOWN -->

            <div
                id="cooldown"
                class="cooldown"
                style="display: none;"
            >

                Next send in:

                <strong
                    id="cooldown-time"
                >
                    30s
                </strong>

            </div>

        </section>

    </main>


    <!--
        Socket.IO
    -->

    <script
        src="/socket.io/socket.io.js"
    ></script>


    <!--
        Controle de cooldown
    -->

    <script
        src="/painel/js/cooldown.js"
    ></script>


    <!--
        Mensagens
        Cria window.panelSocket
    -->

    <script
        src="/painel/js/messages.js"
    ></script>


    <!--
        Painel
        Recebe e renderiza os grupos
    -->

    <script
        src="/painel/js/panel.js"
    ></script>

</body>

</html>
```
