<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WhatsApp Broadcast</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #999;
        }

        .dot.connected {
            background: #22c55e;
        }

        .dot.error {
            background: #ef4444;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        .primary {
            background: #111;
            color: #fff;
        }

        .secondary {
            background: #e5e7eb;
            color: #111;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #groups {
            margin-top: 20px;
        }

        .group {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            background: #fafafa;
        }

        .group:hover {
            background: #f0f1f3;
        }

        .group-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .group-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
        }

        .group-content {
            flex: 1;
            min-width: 0;
        }

        .group-name {
            font-weight: bold;
        }

        .group-id {
            margin-top: 4px;
            font-size: 12px;
            color: #777;
            word-break: break-all;
        }

        .selection-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #f4f5f7;
        }

        .select-all {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .select-all input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .selected-count {
            color: #666;
            font-size: 14px;
        }

        .message-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #message {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        #message:focus {
            outline: none;
            border-color: #111;
        }

        .settings {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #f4f5f7;
        }

        .settings label {
            font-weight: bold;
            font-size: 14px;
        }

        #delay {
            width: 100px;
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        .delay-description {
            color: #666;
            font-size: 13px;
        }

        .send-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
        }

        .send-info {
            color: #666;
            font-size: 14px;
        }

        .send-info strong {
            color: #222;
        }

        #send-status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #f4f5f7;
            color: #555;
            font-size: 14px;
        }

        #logs {
            background: #111;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
        }

        .empty {
            color: #777;
            padding: 20px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="subtitle">
        Select groups and send a broadcast message.
    </div>


    <div class="card">

        <div class="status">

            <span
                id="connection-dot"
                class="dot"
            ></span>

            <strong id="connection-status">
                Connecting...
            </strong>

        </div>


        <button
            id="get-groups"
            class="primary"
            type="button"
        >
            Get Groups
        </button>


        <button
            id="disconnect"
            class="secondary"
            type="button"
        >
            Disconnect
        </button>

    </div>


    <div class="card">

        <h3>Groups</h3>

        <div>
            Total:
            <strong id="group-count">0</strong>
        </div>


        <div class="selection-bar">

            <label class="select-all">

                <input
                    type="checkbox"
                    id="select-all"
                >

                <span>
                    Select All
                </span>

            </label>


            <span
                id="selected-count"
                class="selected-count"
            >
                0 selected
            </span>

        </div>


        <div id="groups">

            <div class="empty">
                No groups received.
            </div>

        </div>

    </div>


    <!-- ===================================== -->
    <!-- BROADCAST                             -->
    <!-- ===================================== -->

    <div class="card">

        <h3>Broadcast</h3>

        <p class="subtitle">
            Write your message and select the groups that will receive it.
        </p>


        <label
            class="message-label"
            for="message"
        >
            Message
        </label>


        <textarea
            id="message"
            maxlength="4096"
            placeholder="Type your broadcast message..."
        ></textarea>


        <!-- ================================= -->
        <!-- DELAY                              -->
        <!-- ================================= -->

        <div class="settings">

            <label for="delay">
                Delay between groups:
            </label>


            <input
                id="delay"
                type="number"
                min="0"
                max="3600"
                step="1"
                value="3"
            >


            <span class="delay-description">
                seconds
            </span>

        </div>


        <div class="send-area">

            <div class="send-info">

                <strong id="send-target-count">
                    0 groups
                </strong>

                <div>
                    selected for delivery
                </div>

            </div>


            <div>

                <button
                    id="send-message"
                    class="primary"
                    type="button"
                    disabled
                >
                    Send Broadcast
                </button>


                <button
                    id="cancel-send"
                    class="secondary"
                    type="button"
                    disabled
                >
                    Cancel
                </button>

            </div>

        </div>


        <div id="send-status">
            Waiting for a message.
        </div>

    </div>


    <div class="card">

        <h3>Logs</h3>

        <div id="logs"></div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script type="module">

    const socket = io()


    const status =
        document.getElementById(
            'connection-status'
        )


    const dot =
        document.getElementById(
            'connection-dot'
        )


    const groupsContainer =
        document.getElementById(
            'groups'
        )


    const groupCount =
        document.getElementById(
            'group-count'
        )


    const logs =
        document.getElementById(
            'logs'
        )


    const getGroupsButton =
        document.getElementById(
            'get-groups'
        )


    const disconnectButton =
        document.getElementById(
            'disconnect'
        )


    const selectAll =
        document.getElementById(
            'select-all'
        )


    const selectedCount =
        document.getElementById(
            'selected-count'
        )


    const sendTargetCount =
        document.getElementById(
            'send-target-count'
        )


    const messageInput =
        document.getElementById(
            'message'
        )


    const delayInput =
        document.getElementById(
            'delay'
        )


    const sendButton =
        document.getElementById(
            'send-message'
        )


    const cancelButton =
        document.getElementById(
            'cancel-send'
        )


    const sendStatus =
        document.getElementById(
            'send-status'
        )


    let availableGroups = []


    let sending = false


    function log(message, data) {

        const time =
            new Date().toLocaleTimeString()


        let text =
            `[${time}] ${message}`


        if (data !== undefined) {

            try {

                text +=
                    '\n' +
                    JSON.stringify(
                        data,
                        null,
                        2
                    )

            } catch (error) {

                text +=
                    '\n' +
                    String(data)

            }

        }


        logs.textContent +=
            text +
            '\n\n'


        logs.scrollTop =
            logs.scrollHeight


        console.log(
            message,
            data
        )

    }


    function getSelectedGroups() {

        return [
            ...document.querySelectorAll(
                '.group-checkbox:checked'
            )
        ].map(
            checkbox =>
                checkbox.value
        )

    }


    function updateSelection() {

        const groupIds =
            getSelectedGroups()


        const selected =
            groupIds.length


        selectedCount.textContent =
            `${selected} selected`


        sendTargetCount.textContent =
            `${selected} ${
                selected === 1
                    ? 'group'
                    : 'groups'
            }`


        selectAll.checked =
            availableGroups.length > 0 &&
            selected ===
                availableGroups.length


        selectAll.indeterminate =
            selected > 0 &&
            selected <
                availableGroups.length


        updateSendButton()


        log(
            'SELECTION UPDATED',
            {
                count:
                    selected,
                groups:
                    groupIds
            }
        )

    }


    function updateSendButton() {

        const groupIds =
            getSelectedGroups()


        const message =
            messageInput.value.trim()


        sendButton.disabled =
            !socket.connected ||
            groupIds.length === 0 ||
            message.length === 0 ||
            sending

    }


    function renderGroups(groups) {

        log(
            'RENDERING GROUPS',
            groups
        )


        if (!Array.isArray(groups)) {

            log(
                'ERROR: groups is not an Array.'
            )

            return

        }


        availableGroups =
            groups


        groupCount.textContent =
            groups.length


        groupsContainer.innerHTML = ''


        if (!groups.length) {

            groupsContainer.innerHTML = `
                <div class="empty">
                    The server returned 0 groups.
                </div>
            `

            updateSelection()

            return

        }


        groups.forEach(
            (group, index) => {

                const div =
                    document.createElement(
                        'div'
                    )


                div.className =
                    'group'


                const name =
                    group?.name ||
                    `Group ${index + 1}`


                const id =
                    group?.id ||
                    ''


                div.innerHTML = `

                    <div class="group-line">

                        <input
                            type="checkbox"
                            class="group-checkbox"
                            value="${escapeHtml(id)}"
                        >

                        <div class="group-content">

                            <div class="group-name">
                                ${escapeHtml(name)}
                            </div>

                            <div class="group-id">
                                ${escapeHtml(id)}
                            </div>

                        </div>

                    </div>

                `


                const checkbox =
                    div.querySelector(
                        '.group-checkbox'
                    )


                checkbox.addEventListener(
                    'change',
                    updateSelection
                )


                groupsContainer.appendChild(
                    div
                )

            }
        )


        updateSelection()


        log(
            'GROUPS RENDERED',
            {
                count:
                    groups.length
            }
        )

    }


    socket.on(
        'connect',
        () => {

            status.textContent =
                'Socket connected'


            dot.className =
                'dot connected'


            log(
                'Socket.IO connected.'
            )


            log(
                'Socket ID:',
                socket.id
            )


            updateSendButton()

        }
    )


    socket.on(
        'disconnect',
        reason => {

            status.textContent =
                'Socket disconnected'


            dot.className =
                'dot error'


            log(
                'Socket.IO disconnected.',
                reason
            )


            updateSendButton()

        }
    )


    socket.on(
        'connect_error',
        error => {

            status.textContent =
                'Connection error'


            dot.className =
                'dot error'


            log(
                'CONNECT ERROR',
                error.message
            )


            updateSendButton()

        }
    )


    socket.on(
        'auth-error',
        data => {

            log(
                'AUTH ERROR',
                data
            )

        }
    )


    socket.on(
        'whatsapp-state',
        state => {

            log(
                'WHATSAPP-STATE RECEIVED',
                state
            )


            if (
                state &&
                Array.isArray(
                    state.groups
                )
            ) {

                renderGroups(
                    state.groups
                )

            }

        }
    )


    socket.on(
        'groups',
        groups => {

            log(
                'GROUPS EVENT RECEIVED',
                groups
            )


            renderGroups(
                groups
            )

        }
    )


    getGroupsButton.addEventListener(
        'click',
        () => {

            log(
                'GET GROUPS BUTTON CLICKED.'
            )


            log(
                'Socket connected:',
                socket.connected
            )


            log(
                'Socket ID:',
                socket.id
            )


            socket.emit(
                'get-groups'
            )


            log(
                'get-groups event sent.'
            )

        }
    )


    selectAll.addEventListener(
        'change',
        () => {

            const checkboxes =
                document.querySelectorAll(
                    '.group-checkbox'
                )


            checkboxes.forEach(
                checkbox => {

                    checkbox.checked =
                        selectAll.checked

                }
            )


            updateSelection()

        }
    )


    messageInput.addEventListener(
        'input',
        () => {

            updateSendButton()

        }
    )


    delayInput.addEventListener(
        'input',
        () => {

            const value =
                Number(
                    delayInput.value
                )


            log(
                'DELAY UPDATED:',
                value
            )

        }
    )


    /*
     * =====================================
     * SEND BROADCAST
     * =====================================
     */

    function sendMessage() {

        log(
            'SEND BROADCAST BUTTON CLICKED.'
        )


        const groupIds =
            getSelectedGroups()


        const message =
            messageInput.value.trim()


        let delay =
            Number(
                delayInput.value
            )


        if (
            !Number.isFinite(delay) ||
            delay < 0
        ) {

            delay = 3

        }


        log(
            'SELECTED GROUPS:',
            groupIds
        )


        log(
            'MESSAGE:',
            message
        )


        log(
            'DELAY:',
            `${delay} seconds`
        )


        if (!socket.connected) {

            sendStatus.textContent =
                'Error: socket is not connected.'

            log(
                'ERROR: Socket disconnected.'
            )

            return

        }


        if (!groupIds.length) {

            sendStatus.textContent =
                'Select at least one group.'

            log(
                'ERROR: No groups selected.'
            )

            return

        }


        if (!message) {

            sendStatus.textContent =
                'Enter a message.'

            log(
                'ERROR: Empty message.'
            )

            return

        }


        if (sending) {

            log(
                'SEND ALREADY IN PROGRESS.'
            )

            return

        }


        sending = true


        sendButton.disabled = true
        cancelButton.disabled = false


        sendStatus.textContent =
            `Sending to ${groupIds.length} groups...`


        const data = {

            groupIds:
                groupIds,

            message:
                message,

            delay:
                delay

        }


        log(
            'SENDING send-message:',
            data
        )


        socket.emit(
            'send-message',
            data
        )


        log(
            'send-message EVENT SENT.'
        )

    }


    sendButton.addEventListener(
        'click',
        sendMessage
    )


    /*
     * =====================================
     * CANCEL SEND
     * =====================================
     */

    cancelButton.addEventListener(
        'click',
        () => {

            log(
                'CANCEL BUTTON CLICKED.'
            )


            socket.emit(
                'cancel-send'
            )


            sendStatus.textContent =
                'Cancellation request sent.'

        }
    )


    /*
     * =====================================
     * SEND RESULTS
     * =====================================
     */

    socket.on(
        'send-result',
        data => {

            log(
                'SEND-RESULT RECEIVED',
                data
            )


            if (
                data &&
                data.success === false
            ) {

                sending = false

                cancelButton.disabled =
                    true


                sendStatus.textContent =
                    data.message ||
                    'Error sending message.'


                updateSendButton()

            }

        }
    )


    socket.on(
        'send-started',
        data => {

            log(
                'SEND-STARTED RECEIVED',
                data
            )

        }
    )


    socket.on(
        'send-progress',
        data => {

            log(
                'SEND-PROGRESS RECEIVED',
                data
            )


            if (!data) {
                return
            }


            const current =
                data.current || 0


            const total =
                data.total || 0


            if (total > 0) {

                sendStatus.textContent =
                    `Sending ${current} of ${total}: ${
                        data.group || ''
                    }`

            }

        }
    )


    socket.on(
        'send-finished',
        data => {

            log(
                'SEND-FINISHED RECEIVED',
                data
            )


            sending = false


            cancelButton.disabled =
                true


            sendStatus.textContent =
                'Broadcast completed.'


            updateSendButton()

        }
    )


    socket.on(
        'send-cancelled',
        data => {

            log(
                'SEND-CANCELLED RECEIVED',
                data
            )


            sending = false


            cancelButton.disabled =
                true


            sendStatus.textContent =
                'Broadcast cancelled.'


            updateSendButton()

        }
    )


    socket.on(
        'cancel-result',
        data => {

            log(
                'CANCEL-RESULT RECEIVED',
                data
            )

        }
    )


    disconnectButton.addEventListener(
        'click',
        () => {

            log(
                'DISCONNECT BUTTON CLICKED.'
            )


            socket.disconnect()

        }
    )


    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            )

    }

</script>

</body>

</html>
