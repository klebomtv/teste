```html
<!-- caminho: public/index.html -->

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        WhatsApp Bot
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

    <main
        id="start-page"
        class="page"
    >

        <section
            class="card start-card"
        >

            <h1>
                WhatsApp Bot
            </h1>

            <button
                id="start-whatsapp"
                type="button"
            >
                Generate QR Code
            </button>

        </section>

    </main>

    <main
        id="qr-page"
        class="page"
        style="display: none;"
    >

        <section
            class="card qr-card"
        >

            <h1>
                Connect WhatsApp
            </h1>

            <p class="description">
                Scan the QR Code with your WhatsApp.
            </p>

            <div
                id="qr-container"
                class="qr-container"
            >

                <div
                    id="qr-content"
                    class="qr-content"
                >

                    <span>
                        Waiting for QR Code...
                    </span>

                </div>

            </div>

            <p
                id="qr-status"
                class="qr-status"
            >
                Waiting for QR Code generation...
            </p>

        </section>

    </main>

    <main
        id="panel-page"
        class="page"
        style="display: none;"
    >

        <section
            class="card panel-card"
        >

            <h1>
                WhatsApp Bot
            </h1>

            <p>
                WhatsApp connected.
            </p>

        </section>

    </main>

    <script
        src="/socket.io/socket.io.js"
    ></script>

    <script
        src="/app.js"
        type="module"
    ></script>

</body>

</html>
```
